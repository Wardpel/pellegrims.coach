version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    rebase-strategy: "auto"
    assignees:
      - "robinpellegrims"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      backend-admin:
        patterns:
          - "payload"
          - "@payloadcms/*"
          - "nodemailer"
          - "@libsql/client"
          - "graphql"
        update-types:
          - "patch"
          - "minor"
      frontend:
        patterns:
          - "next"
          - "@next/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "framer-motion"
          - "clsx"
          - "tailwind-merge"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "postcss"
          - "autoprefixer"
          - "prettier-plugin-tailwindcss"
          - "@vercel/*"
        update-types:
          - "patch"
          - "minor"
      quality-and-test:
        patterns:
          - "eslint"
          - "eslint-config-next"
          - "typescript"
          - "@types/node"
          - "prettier"
          - "husky"
          - "lint-staged"
          - "@playwright/test"
          - "playwright"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 3
    assignees:
      - "robinpellegrims"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
